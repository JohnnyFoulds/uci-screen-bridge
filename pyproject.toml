[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uci-screen-bridge"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"uci_screen_bridge.models" = ["*.onnx", "*.JPG"]

[project.scripts]
uci-screen-bridge = "uci_screen_bridge.gui:main"
